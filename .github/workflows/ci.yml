name: XAYMACA CI

on:
  push:
    branches:
      - rebuild/xaymaca-v2
  pull_request:
    branches:
      - main

concurrency:
  group: xaymaca-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Compile contracts
        run: npm run contracts:compile

      - name: Contract tests
        run: npm run contracts:test
